<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Fiti Login</title>
    <link rel="stylesheet" href="./Login.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="card">
        <p class="welcome-text">Welcome to</p>
        <h1 class="logo">HEALTH FITI</h1>
        <div id="errorCard" class="error-card" style="display: none;">
            User invalid or not found
        </div>
        <div class="input-group">
            <div class="input-container">
                <i class="fa-solid fa-user icon"></i>
                <input type="text" id="username" placeholder="Username">
            </div>
            <div class="input-container">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" id="password" placeholder="Password">
            </div>
        </div>

        <div class="button-group">
            <button id="loginBtn" class="btn">Login</button>
        </div>
        <p class="signup-text">
           Are you a new user? <a href="javascript:void(0)" onclick="navigateTo('signup')">Sign up</a>
        </p>
        
    </div>

    <script src="./JSlogin.js"></script>
    <script src="../App.js"></script>
</body>
</html>
