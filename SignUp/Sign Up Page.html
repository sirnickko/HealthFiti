<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <style>
    /* ──────────────────────────────────────────────── */
    /* Keep your previous nice CSS here — unchanged     */
    body {
      margin: 0; padding: 0;
      font-family: system-ui, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: white;
      width: 100%; max-width: 380px;
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      margin: 20px;
    }
    .header {
      background: #10b981; color: white;
      padding: 28px 24px 20px;
      text-align: center; font-size: 1.7rem; font-weight: 600;
      position: relative;
    }
    .header .back {
      position: absolute; left: 20px; top: 28px;
      font-size: 1.4rem; cursor: pointer; color: white;
      text-decoration: none;
    }
    .form-container { padding: 32px 24px 40px; }
    .input-group { margin-bottom: 22px; position: relative; }
    label { display: block; margin-bottom: 6px; color: #374151; font-weight: 500; font-size: 0.95rem; }
    input {
      width: 100%; padding: 13px 16px;
      border: 1px solid #d1d5db; border-radius: 10px;
      font-size: 1rem; box-sizing: border-box;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none; border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
    }
    .btn-signup {
      width: 100%; padding: 14px;
      background: #111827; color: white; border: none;
      border-radius: 10px; font-size: 1.05rem; font-weight: 600;
      cursor: pointer; margin-top: 12px;
    }
    .btn-signup:hover { background: #1f2937; }
    .login-link { text-align: center; margin-top: 24px; color: #6b7280; font-size: 0.95rem; }
    .login-link a { color: #10b981; text-decoration: none; font-weight: 500; }
    .login-link a:hover { text-decoration: underline; }
    .message {
      padding: 12px; margin-bottom: 20px; border-radius: 8px; text-align: center;
    }
    .success { background: #d1fae5; color: #065f46; }
    .error   { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <a href="#" class="back">←</a>
    Sign Up
  </div>

  <div class="form-container">

   

    <form method="POST" action="">

      <div class="input-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" placeholder="John" required value="">
      </div>

      <div class="input-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" placeholder="Doe" required value="">
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="johndoe@xyz.com" required value="">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
      </div>

      <button type="submit" class="btn-signup">Sign Up</button>

    </form>

    <div class="login-link">
      Already have an account? <a href="#">Sign In</a>
    </div>

  </div>
</div>

</body>
</html>
<script>
  const form = document.querySelector('form');
  const messageDiv = document.createElement('div');
  messageDiv.className = 'message';
  form.parentElement.insertBefore(messageDiv, form);

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    messageDiv.textContent = '';
    messageDiv.className = 'message';

    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!firstName || !lastName || !email || !password || !confirmPassword) {
      messageDiv.textContent = 'All fields are required.';
      messageDiv.classList.add('error');
      return;
    }

    if (password !== confirmPassword) {
      messageDiv.textContent = 'Passwords do not match.';
      messageDiv.classList.add('error');
      return;
    }

    if (password.length < 6) {
      messageDiv.textContent = 'Password must be at least 6 characters.';
      messageDiv.classList.add('error');
      return;
    }

    messageDiv.textContent = 'Sign up successful!';
    messageDiv.classList.add('success');
    form.reset();
  });

  document.querySelector('.back').addEventListener('click', function(e) {
    e.preventDefault();
    window.location.href = 'Login.html';
  });
  document.querySelector('.login-link a').addEventListener('click', function(e) {
    e.preventDefault();
    window.location.href = 'Dash.html';
  });
</script>
